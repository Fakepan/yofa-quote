<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root{ --navy:#1F3864; --ink:#1a2233; --sub:#6b7686; --line:#e0e4ea;
         --warnbg:#fff4e5; --warnline:#f0c48a; --warnink:#8a5300; }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:20px 24px;
    font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
    color:var(--ink); background:#fff;
  }
  h3{ margin:0 0 2px; font-size:17px; color:var(--navy); text-align:center; }
  .sub{ font-size:12px; color:var(--sub); margin-bottom:16px; text-align:center; }
  ol{ margin:0; padding-left:20px; }
  li{ font-size:14px; line-height:2.0; }
  kbd{
    font-family:inherit; font-size:13px; font-weight:700;
    background:#f1f3f7; border:1px solid var(--line);
    border-radius:5px; padding:2px 7px;
  }
  /* 警告框：這一步最容易做錯，「下載」和「列印」只差一個字，結果天差地遠 */
  .warn{
    margin-top:16px; padding:10px 12px;
    background:var(--warnbg); border:1px solid var(--warnline);
    border-radius:8px; font-size:12px; line-height:1.7; color:var(--warnink);
  }
  .note{ font-size:11px; color:var(--sub); margin-top:12px; line-height:1.7; }
</style>
</head>
<body>
  <h3><?= title ?> 保養檢查照片</h3>
  <div class="sub">分頁：<?= tabName ?></div>

  <ol>
    <li>點上方 <kbd>檔案</kbd> → <kbd>列印</kbd></li>
    <li>右下角按 <kbd>下一步</kbd></li>
    <li>「目的地」選 <kbd>另存為 PDF</kbd></li>
    <li>按 <kbd>儲存</kbd></li>
  </ol>

  <div class="warn">
    ⚠ 請走 <b>列印</b>，不要用「檔案 → <b>下載</b> → PDF」。<br>
    下載走的是 Google 伺服器的排版引擎，會把<b>廠商用印簽名欄擠到下一張紙</b>
    （實測 58 張紙有 25 張只剩一行簽名）。列印用的才是產生正確預覽的引擎。
  </div>

  <div class="note">
    列印設定已經調好（A4 直式、自訂分頁符號、上 1 公分／下 0.8 公分），
    直接按下一步即可，不用再改。
  </div>
</body>
</html>
