<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16305C">
<style>
/* ============================================================
 * v10 視覺系統
 * 設計取向：工程現場工具，不是消費型 App
 *   ① 高對比 —— 機房光線差、戶外強光下都要看得清
 *   ② 大觸控區 —— 主要按鈕 ≥60px，戴手套也按得到
 *   ③ 步驟明確 —— 師傅隨時知道自己在第幾步、還差什麼
 *   ④ 數據可讀 —— 技術資訊用等寬數字，不會跳動
 * 深色模式：機房夜間作業自動套用，不刺眼
 * ============================================================ */
:root{
  /* 品牌 */
  --navy:        #1B3A6B;
  --navy-deep:   #16305C;
  --navy-soft:   #2C5490;
  /* 工程安全色（高速公路意象），用於步驟指示與焦點 */
  --amber:       #C2710C;
  --amber-soft:  #FEF3E2;
  /* 語意色 */
  --ok:          #15803D;
  --ok-soft:     #E9F6EE;
  --err:         #B3261E;
  --err-soft:    #FDECEA;
  /* 介面 */
  --bg:          #F1F4F8;
  --card:        #FFFFFF;
  --line:        #DDE3EC;
  --line-strong: #C3CCDA;
  --ink:         #0E1726;
  --ink-mid:     #40506A;
  --sub:         #6B7A93;
  --disabled-bg: #E4E9F0;
  --disabled-ink:#9AA6B8;
  --shadow-sm:   0 1px 2px rgba(16,32,64,.06);
  --shadow-md:   0 2px 8px rgba(16,32,64,.08);
  --shadow-lg:   0 8px 24px rgba(16,32,64,.12);
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --navy:#3E6BB0; --navy-deep:#16305C; --navy-soft:#5583C4;
    --amber:#E39A3C; --amber-soft:#38290F;
    --ok:#4ADE80; --ok-soft:#12301E;
    --err:#F87171; --err-soft:#331616;
    --bg:#0B121F; --card:#141E31; --line:#26334A; --line-strong:#39485F;
    --ink:#E8EDF5; --ink-mid:#B4C0D2; --sub:#8494AC;
    --disabled-bg:#1D2739; --disabled-ink:#5A6880;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 2px 8px rgba(0,0,0,.45);
    --shadow-lg:0 8px 24px rgba(0,0,0,.55);
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:var(--bg);color:var(--ink);
  font-size:17px;line-height:1.55;
  /* 底部留白，避免最後一顆按鈕被手機手勢列蓋住 */
  padding-bottom:env(safe-area-inset-bottom);
}

/* ---------- 頁首 ---------- */
header{
  background:linear-gradient(160deg,var(--navy-deep) 0%,var(--navy) 100%);
  color:#fff;position:sticky;top:0;z-index:20;
  padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
  box-shadow:var(--shadow-md);
}
.brand{display:flex;align-items:center;gap:11px}
.mark{
  width:38px;height:38px;flex:none;border-radius:10px;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:800;letter-spacing:.5px;
}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:18px;font-weight:750;letter-spacing:.4px;line-height:1.25}
.brand-txt span{
  display:block;font-size:11.5px;opacity:.72;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ver{
  margin-left:auto;flex:none;align-self:flex-start;
  font-size:10.5px;font-weight:600;letter-spacing:.3px;
  padding:3px 8px;border-radius:20px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);
}

/* ---------- 步驟指示 ---------- */
.steps{display:flex;align-items:flex-start;margin-top:14px;padding:0 2px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
.step::before{         /* 連接線 */
  content:'';position:absolute;top:12px;left:-50%;width:100%;height:2px;
  background:rgba(255,255,255,.2);
}
.step:first-child::before{display:none}
.dot{
  width:25px;height:25px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:700;position:relative;z-index:1;
  background:rgba(255,255,255,.16);color:rgba(255,255,255,.6);
  border:1.5px solid transparent;transition:.22s;
}
.step-t{font-size:11px;opacity:.6;letter-spacing:.2px;transition:.22s}
.step.on .dot{background:#fff;color:var(--navy-deep);transform:scale(1.06)}
.step.on .step-t{opacity:1;font-weight:650}
.step.done .dot{background:rgba(255,255,255,.9);color:var(--navy-deep)}
.step.done .step-t{opacity:.85}

/* ---------- 版面 ---------- */
.wrap{padding:16px 16px 44px;max-width:560px;margin:0 auto}

/* ---------- 卡片 ---------- */
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:16px 15px;margin-bottom:14px;
  box-shadow:var(--shadow-sm);
}
.card-h{
  display:flex;align-items:center;gap:8px;
  margin:-2px 0 13px;padding-bottom:11px;border-bottom:1px solid var(--line);
}
.card-n{
  width:22px;height:22px;flex:none;border-radius:6px;
  background:var(--navy);color:#fff;
  font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.card-h h2{margin:0;font-size:14.5px;font-weight:700;letter-spacing:.3px;color:var(--ink)}

/* ---------- 表單 ---------- */
.field{margin-bottom:13px}
.field:last-child{margin-bottom:0}
label{
  display:block;font-size:12px;font-weight:700;letter-spacing:.6px;
  color:var(--sub);margin:0 0 6px 2px;text-transform:none;
}
select{
  width:100%;padding:15px 42px 15px 14px;font-size:17px;font-weight:500;
  border:1.5px solid var(--line-strong);border-radius:var(--r-md);
  background-color:var(--card);color:var(--ink);
  appearance:none;font-family:inherit;transition:.16s;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' fill='none' stroke='%236B7A93' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l5 5 5-5'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;
}
select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(27,58,107,.13)}
select:disabled{
  background-color:var(--disabled-bg);color:var(--disabled-ink);
  border-color:var(--line);cursor:not-allowed;
}
select.filled{border-color:var(--navy-soft);font-weight:600}

/* ---------- 即將拍攝確認條 ---------- */
.slot{
  display:none;margin-bottom:14px;
  background:var(--amber-soft);border:1px solid rgba(194,113,12,.28);
  border-left:4px solid var(--amber);
  border-radius:var(--r-md);padding:12px 14px;
}
.slot-l{
  display:flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--amber);
  margin-bottom:4px;
}
.slot b{display:block;font-size:16px;font-weight:700;line-height:1.4;color:var(--ink)}

/* ---------- 按鈕 ---------- */
.btn{
  width:100%;min-height:60px;padding:16px;
  font-family:inherit;font-size:17.5px;font-weight:700;letter-spacing:.4px;
  border:none;border-radius:var(--r-md);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:9px;
  transition:transform .1s,box-shadow .16s,background .16s;
}
.btn:active:not(:disabled){transform:scale(.985)}
.btn svg{flex:none}
.btn-primary{background:var(--navy);color:#fff;box-shadow:var(--shadow-md)}
.btn-primary:active:not(:disabled){background:var(--navy-deep)}
.btn-outline{
  background:var(--card);color:var(--navy);
  border:2px solid var(--navy);box-shadow:var(--shadow-sm);
}
.btn-go{background:var(--ok);color:#fff;font-size:18.5px;box-shadow:var(--shadow-md)}
.btn-quiet{
  min-height:50px;font-size:15.5px;font-weight:600;
  background:transparent;color:var(--sub);border:1.5px solid var(--line-strong);
  box-shadow:none;
}
.btn:disabled{
  background:var(--disabled-bg)!important;color:var(--disabled-ink)!important;
  border-color:var(--disabled-bg)!important;box-shadow:none!important;cursor:not-allowed;
}
.stack{display:flex;flex-direction:column;gap:10px}
.hint{
  font-size:12px;color:var(--sub);text-align:center;
  margin-top:10px;line-height:1.5;
}

/* ---------- 預覽 ---------- */
#preview{display:none}
.shot{
  position:relative;border-radius:var(--r-md);overflow:hidden;
  border:1px solid var(--line-strong);background:#fff;margin-bottom:11px;
}
#preview img{width:100%;display:block}
.chips{display:flex;flex-direction:column;gap:7px;margin-bottom:13px}
.chip{
  font-size:12px;font-weight:600;line-height:1.5;
  padding:8px 11px;border-radius:var(--r-sm);
  display:flex;align-items:flex-start;gap:7px;
}
.cropinfo{background:var(--ok-soft);color:var(--ok);border:1px solid rgba(21,128,61,.2)}
.cropinfo.bad{background:var(--err-soft);color:var(--err);border-color:rgba(179,38,30,.25)}
#shotInfo{
  display:none;background:var(--bg);color:var(--ink-mid);
  border:1px solid var(--line);
}

/* ---------- 計數 ---------- */
.count{
  display:none;margin-top:16px;text-align:center;
  font-size:13px;font-weight:600;color:var(--sub);
  font-variant-numeric:tabular-nums;
}
.count.show{display:block}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(22px);
  background:var(--ink);color:#fff;
  padding:14px 20px;border-radius:14px;
  font-size:14.5px;font-weight:600;line-height:1.5;
  opacity:0;transition:.26s cubic-bezier(.2,.8,.3,1);
  pointer-events:none;max-width:min(88%,460px);text-align:left;
  box-shadow:var(--shadow-lg);z-index:60;
  word-break:break-word;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:var(--ok)}
#toast.err{background:var(--err)}

canvas{display:none}

/* 寬螢幕：維持單欄手機版型（現場用），但加點呼吸感 */
@media (min-width:640px){
  .wrap{padding-top:22px}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">佑</div>
    <div class="brand-txt">
      <b>佑發 · 保養拍照</b>
      <span>高速公路局北區養護工程分局</span>
    </div>
    <div class="ver">v11</div>
  </div>

  <!-- 步驟指示：讓師傅隨時知道進行到哪 -->
  <div class="steps" id="steps">
    <div class="step on" id="st1"><div class="dot">1</div><div class="step-t">選位置</div></div>
    <div class="step"    id="st2"><div class="dot">2</div><div class="step-t">拍照</div></div>
    <div class="step"    id="st3"><div class="dot">3</div><div class="step-t">上傳</div></div>
  </div>
</header>

<div class="wrap">

  <!-- ① 選擇拍攝位置 -->
  <section class="card">
    <div class="card-h">
      <div class="card-n">1</div>
      <h2>選擇拍攝位置</h2>
    </div>

    <div class="field">
      <label for="room">機房</label>
      <select id="room"><option value="">選單載入中…</option></select>
    </div>

    <div class="field">
      <label for="equip">設備編號</label>
      <select id="equip" disabled><option value="">先選機房</option></select>
    </div>

    <div class="field">
      <label for="item">檢查項目</label>
      <select id="item" disabled><option value="">先選設備</option></select>
    </div>
  </section>

  <!-- 即將拍攝確認 -->
  <div class="slot" id="slotBox">
    <div class="slot-l">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      即將拍攝
    </div>
    <b id="slotText"></b>
  </div>

  <!-- ② 拍攝 -->
  <section class="card">
    <div class="card-h">
      <div class="card-n">2</div>
      <h2>拍攝照片</h2>
    </div>

    <div class="stack">
      <button class="btn btn-primary" id="camBtn" disabled>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>
        </svg>
        直接拍照
      </button>

      <button class="btn btn-outline" id="selBtn" disabled>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
        從相簿選擇
      </button>
    </div>

    <div class="hint">使用「時間相機 App」拍好後，<br>點『從相簿選擇』即可保留浮水印</div>
  </section>

  <!-- 相機 input（capture=environment 強制後鏡頭） -->
  <input type="file" id="camInput" accept="image/*" capture="environment" style="display:none">
  <!-- 相簿 input（不加 capture，讓使用者選相簿） -->
  <input type="file" id="galInput" accept="image/*" style="display:none">

  <!-- ③ 確認並上傳 -->
  <div id="preview">
    <section class="card">
      <div class="card-h">
        <div class="card-n">3</div>
        <h2>確認並上傳</h2>
      </div>

      <div class="shot"><img id="previewImg" alt="照片預覽"></div>

      <div class="chips">
        <div class="chip cropinfo" id="cropInfo"></div>
        <div class="chip" id="shotInfo"></div>
      </div>

      <div class="stack">
        <button class="btn btn-go" id="upBtn">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>
          </svg>
          上傳並歸檔
        </button>
        <button class="btn btn-quiet" id="retakeBtn">重新選擇照片</button>
      </div>
    </section>
  </div>

  <div class="count" id="count"></div>
</div>

<canvas id="cv"></canvas>
<div id="toast"></div>

<script>
/* ============================================================
 * 常數設定區（要調整行為只需改這裡）
 * ============================================================ */
const BOX_RATIO   = 404 / 330; // ★容器比例，與後端 404x330 一致（改這裡即可同步裁切比例）
const MAX_SIDE    = 1024;      // 壓縮最長邊（px）
const JPEG_Q      = 0.75;      // JPEG 品質（0~1）
const MAX_FILE_MB = 25;        // 原始檔案大小上限（MB），超過視為選錯檔，直接擋下
const MENU_RETRY  = 3;         // 選單載入失敗時的自動重試次數

let MENU = {}, uploadedCount = 0, currentDataUrl = null;
let currentShotYmd = null;   // ★v6★ 照片 EXIF 拍攝日（YYYY-MM-DD），讀不到為 null
const $ = id => document.getElementById(id);

/* ============================================================
 * ★v10★ 步驟指示器
 * 純視覺輔助，不影響任何既有邏輯：依「目前狀態」推導在第幾步。
 *   1 = 位置還沒選齊  2 = 選好了，等拍照  3 = 照片已就緒，等上傳
 * ============================================================ */
function updateStepper() {
  const ready   = !!($('room').value && $('equip').value && $('item').value);
  const hasShot = !!currentDataUrl;
  const now = hasShot ? 3 : (ready ? 2 : 1);
  [1, 2, 3].forEach(n => {
    const el = $('st' + n);
    el.className = 'step' + (n === now ? ' on' : (n < now ? ' done' : ''));
  });
}

/* 下拉選單已選取時給予視覺回饋（加粗＋邊框變色） */
function markFilled(el) {
  el.classList.toggle('filled', !!el.value);
}

/* ============================================================
 * ★v11★ 設備下拉排序：依保養動線 AHU → ACU → CHU → CTR → ACP → 其他
 * 背景：MENU_TREE 的鍵順序沿用母版「報表頁面」排列，設備會交錯出現
 *      （泰控機房 47 台裡 AHU 與 ACP 一台一台夾雜，「其他」還卡在中間）。
 * 做法：只在「顯示時」重新排序，完全不動 MENU_TREE 與 desc 定位鍵，
 *      對後端、母版、稽核函式零影響。
 * ============================================================ */
const EQUIP_ORDER = ['AHU', 'ACU', 'CHU', 'CTR', 'ACP'];

function sortEquipKeys(keys) {
  return keys.slice().sort(function (a, b) {
    const pa = a.match(/^([A-Za-z]+)-?(\d+)?/);
    const pb = b.match(/^([A-Za-z]+)-?(\d+)?/);
    if (!pa && !pb) return a.localeCompare(b, 'zh-Hant');
    if (!pa) return 1;          // 「其他」這類非代號一律排最後
    if (!pb) return -1;
    const ia = EQUIP_ORDER.indexOf(pa[1].toUpperCase());
    const ib = EQUIP_ORDER.indexOf(pb[1].toUpperCase());
    const ra = (ia < 0) ? 99 : ia;   // 不在清單內的代號排在已知類別之後
    const rb = (ib < 0) ? 99 : ib;
    if (ra !== rb) return ra - rb;                        // 先比設備類別
    if (pa[1] !== pb[1]) return pa[1].localeCompare(pb[1]);
    return (+(pa[2] || 0)) - (+(pb[2] || 0));             // 再比編號（數值比較，非字串）
  });
}

/* ============================================================
 * 民國年月
 * ★改為「函式」而非頁面載入時算一次：
 *   外場常常一頁開整天，跨到隔月（例如 8/31 晚上開著放到 9/1）
 *   舊寫法會把 9 月的照片歸到 8 月，改成上傳當下即時計算。
 * ============================================================ */
function nowYm() {
  const d = new Date();
  return (d.getFullYear() - 1911) + '年' + (d.getMonth() + 1) + '月';
}

/* ============================================================
 * ★v6★ 照片 EXIF 拍攝日
 * 手機拍照時會把拍攝時間寫進 JPEG 檔案（EXIF），這裡直接從檔案
 * 開頭的二進位資料把它讀出來（不需要任何外部函式庫）。
 * 讀到 → 施工/完工日期、月份分頁、Drive 資料夾都以拍攝日為準（A 方案）
 * 讀不到（截圖、通訊軟體壓縮過的圖…）→ 自動退回上傳當天
 * ============================================================ */
function parseExifDate(buf) {
  try {
    const v = new DataView(buf);
    if (v.getUint16(0) !== 0xFFD8) return null;              // 不是 JPEG
    let o = 2;
    while (o + 4 < v.byteLength) {
      const marker = v.getUint16(o), size = v.getUint16(o + 2);
      if (marker === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) {  // APP1 'Exif'
        const t = o + 10;                                     // TIFF 標頭起點
        const little = v.getUint16(t) === 0x4949;             // 'II' = 小端序
        const g16 = x => v.getUint16(x, little), g32 = x => v.getUint32(x, little);
        const dirs = [t + g32(t + 4)];                        // IFD0
        const found = {};
        while (dirs.length) {
          const d = dirs.shift();
          const n = g16(d);
          for (let i = 0; i < n; i++) {
            const e = d + 2 + i * 12, tag = g16(e);
            if (tag === 0x8769) dirs.push(t + g32(e + 8));    // Exif 子目錄
            if (tag === 0x9003 || tag === 0x0132) {           // 原始拍攝時間 / 修改時間
              const cnt = g32(e + 4), off = cnt > 4 ? t + g32(e + 8) : e + 8;
              let s = '';
              for (let j = 0; j < Math.min(cnt, 19); j++) s += String.fromCharCode(v.getUint8(off + j));
              found[tag] = s;
            }
          }
        }
        const s = found[0x9003] || found[0x0132];             // 優先「原始拍攝時間」
        const m = /^(\d{4}):(\d{2}):(\d{2})/.exec(s || '');
        return m ? m[1] + '-' + m[2] + '-' + m[3] : null;
      }
      if ((marker & 0xFF00) !== 0xFF00) break;                // 不是合法區段，停止
      o += 2 + size;
    }
  } catch (e) { console.warn('[exif] 解析失敗（不影響上傳）', e); }
  return null;
}

/* 拍攝日 YYYY-MM-DD → 民國顯示與民國年月（Drive 資料夾用） */
function rocFromYmd(ymd) {
  const p = ymd.split('-');
  return (+p[0] - 1911) + '/' + p[1] + '/' + p[2];
}
function ymFromYmd(ymd) {
  const p = ymd.split('-');
  return (+p[0] - 1911) + '年' + (+p[1]) + '月';
}
function updateShotInfo() {
  const el = $('shotInfo');
  el.style.display = 'flex';
  el.textContent = currentShotYmd
    ? '📅 拍攝日期 ' + rocFromYmd(currentShotYmd) + '　日期與月份歸檔以此為準'
    : '📅 讀不到拍攝日期，將以「上傳當天」為準';
}

/* ============================================================
 * 載入選單（含失敗自動重試）
 * 舊版沒有 withFailureHandler：後端一出錯，三個下拉永遠是空的、
 * 使用者只會看到「先選機房」卡死。這裡補上錯誤提示 + 自動重試。
 * ============================================================ */
function loadMenu(attempt) {
  attempt = attempt || 1;
  console.log('[getMenu] 開始載入選單，第 ' + attempt + ' 次');
  google.script.run
    .withSuccessHandler(m => {
      try {
        if (!m || typeof m !== 'object' || Object.keys(m).length === 0) {
          throw new Error('後端回傳的選單是空的，請檢查母版選單來源');
        }
        MENU = m;
        const r = $('room');
        r.innerHTML = '<option value="">請選擇機房…</option>';
        Object.keys(MENU).forEach(k => r.add(new Option(k, k)));
        console.log('[getMenu] 載入成功，機房數：' + Object.keys(MENU).length);
      } catch (err) {
        console.error('[getMenu] 資料異常：', err);
        toast('選單資料異常：' + err.message, 'err');
      }
    })
    .withFailureHandler(err => {
      console.error('[getMenu] 呼叫失敗：', err);
      if (attempt < MENU_RETRY) {
        // 指數退避：1 秒、2 秒後重試，避免瞬間網路不穩就整頁報廢
        setTimeout(() => loadMenu(attempt + 1), attempt * 1000);
      } else {
        $('room').innerHTML = '<option value="">選單載入失敗，請重新整理</option>';
        toast('選單載入失敗：' + (err && err.message ? err.message : '連線異常') + '，請重新整理頁面', 'err');
      }
    })
    .getMenu();
}
loadMenu();

/* ============================================================
 * 三層連動下拉（機房 → 設備 → 項目）
 * 補上 MENU 結構的防呆：若後端資料缺層（例如某機房底下沒設備）
 * 舊版會直接 throw 讓整頁 JS 掛掉，這裡改為提示並保持可操作。
 * ============================================================ */
$('room').onchange = e => {
  const eq = $('equip');
  eq.innerHTML = '<option value="">請選擇設備…</option>';
  $('item').innerHTML = '<option value="">先選設備</option>';
  $('item').disabled = true;
  const roomData = e.target.value ? MENU[e.target.value] : null;
  if (roomData && typeof roomData === 'object') {
    sortEquipKeys(Object.keys(roomData)).forEach(k => eq.add(new Option(k, k)));
    eq.disabled = false;
  } else {
    if (e.target.value) {
      console.warn('[menu] 機房「' + e.target.value + '」底下沒有設備資料');
      toast('此機房沒有設備資料，請檢查選單來源', 'err');
    }
    eq.disabled = true;
  }
  markFilled(e.target); markFilled(eq); markFilled($('item'));
  refreshSlot();
};

$('equip').onchange = e => {
  const it = $('item');
  it.innerHTML = '<option value="">請選擇項目…</option>';
  const room = $('room').value;
  const items = (e.target.value && MENU[room]) ? MENU[room][e.target.value] : null;
  if (Array.isArray(items) && items.length) {
    items.forEach(x => it.add(new Option(x.label || x.desc, x.desc)));
    it.disabled = false;
  } else {
    if (e.target.value) {
      console.warn('[menu] 設備「' + e.target.value + '」底下沒有檢查項目');
      toast('此設備沒有檢查項目，請檢查選單來源', 'err');
    }
    it.disabled = true;
  }
  markFilled(e.target); markFilled(it);
  refreshSlot();
};
$('item').onchange = e => { markFilled(e.target); refreshSlot(); };

function refreshSlot() {
  const r = $('room').value, e = $('equip').value, i = $('item').value;
  const ready = !!(r && e && i);
  $('camBtn').disabled = !ready;
  $('selBtn').disabled = !ready;
  $('slotBox').style.display = ready ? 'block' : 'none';
  if (ready) $('slotText').textContent = r + ' · ' + i;
  updateStepper();
}

/* ============================================================
 * 按鈕觸發對應 input
 * ============================================================ */
$('camBtn').onclick = () => $('camInput').click();
$('selBtn').onclick = () => $('galInput').click();
$('retakeBtn').onclick = () => {
  $('camInput').value = '';
  $('galInput').value = '';
  $('preview').style.display = 'none';
  $('shotInfo').style.display = 'none';
  currentDataUrl = null;
  currentShotYmd = null;
  updateStepper();
};

// 兩個 input 都走同一個處理流程
$('camInput').onchange = ev => handleFile(ev.target.files[0]);
$('galInput').onchange = ev => handleFile(ev.target.files[0]);

/* ============================================================
 * 檔案接收 + 防呆
 * ① 檔案型別檢查：相簿可能誤選到影片/PDF，先擋下
 * ② 檔案大小檢查：超大檔（全景照等）轉 dataURL 會讓手機記憶體爆掉
 * ③ 改用 URL.createObjectURL 解碼：
 *    比 FileReader→dataURL 少一份 base64 副本、速度較快也較省記憶體
 *    （特殊寫法說明：objectURL 用完必須 revokeObjectURL 釋放，否則會累積佔記憶體）
 * ============================================================ */
function handleFile(file) {
  if (!file) return;
  try {
    console.log('[file] 選取：' + file.name + '，' + (file.size / 1048576).toFixed(2) + ' MB，type=' + file.type);

    if (file.type && !file.type.startsWith('image/')) {
      toast('請選擇「照片」檔案（目前選到的是 ' + file.type + '）', 'err');
      return;
    }
    if (file.size > MAX_FILE_MB * 1048576) {
      toast('檔案超過 ' + MAX_FILE_MB + 'MB，請改用一般照片模式拍攝', 'err');
      return;
    }

    // ★v6★ 先讀 EXIF 拍攝日（只讀檔案開頭 256KB，速度極快；與壓縮平行進行）
    currentShotYmd = null;
    const fr = new FileReader();
    fr.onload  = () => { currentShotYmd = parseExifDate(fr.result); updateShotInfo(); };
    fr.onerror = () => updateShotInfo();
    fr.readAsArrayBuffer(file.slice(0, 262144));

    const objUrl = URL.createObjectURL(file);
    compress(objUrl, () => URL.revokeObjectURL(objUrl));
  } catch (err) {
    console.error('[file] 讀取失敗：', err);
    toast('照片讀取失敗，請重新選擇', 'err');
  }
}

/* ============================================================
 * ★v7 Contain 等比縮放 + 補白邊★（取代 v4~v6 的 Cover 置中裁切）
 * 修正原因：時間相機 App 的「左上角 GPS 地圖」與「右上角時間浮水印」位在
 * 畫面最邊緣，舊版為了零白邊而裁切邊緣，會讓這些送審必要資訊消失，
 * 導致工程驗收被退件。
 * 新策略：原圖 100% 保留 → 等比縮小塞進 404:330 比例畫布 → 剩餘空間補純白。
 * 輸出比例仍吻合容器，放進儲存格不會變形。
 * done：載入結束後的回呼，用來釋放 objectURL
 * ============================================================ */
function compress(src, done) {
  const img = new Image();

  img.onload = () => {
    try {
      const cv = $('cv'), ctx = cv.getContext('2d');

      const iw = img.width, ih = img.height;
      if (!iw || !ih) throw new Error('照片尺寸為 0，可能是損毀檔');

      // ① 畫布尺寸：固定為容器比例 BOX_RATIO，最長邊不超過 MAX_SIDE
      //    （比例吻合容器 → 放進儲存格不會被二次縮放變形）
      let outW = MAX_SIDE;
      let outH = Math.round(MAX_SIDE / BOX_RATIO);

      // ② ★Contain 等比縮放★：算出「能完整塞進畫布」的縮放比
      //    取寬高兩個縮放比中「較小」者 → 保證原圖每一個像素都在畫布內，
      //    時間相機的左上角 GPS 地圖與右上角時間浮水印 100% 不會被裁掉。
      //    原圖比畫布小時 scale 會 >1，此處夾在 1 以內避免放大失真。
      const scale = Math.min(outW / iw, outH / ih, 1);
      const drawW = Math.round(iw * scale);
      const drawH = Math.round(ih * scale);

      // ③ 置中：多出來的空間平均分配到上下（或左右）
      const dx = Math.round((outW - drawW) / 2);
      const dy = Math.round((outH - drawH) / 2);

      // ④ 先鋪滿純白背景，再把等比縮小後的完整原圖畫上去
      //    （不先填白的話，JPEG 沒有透明通道，空白處會變成黑色）
      cv.width = outW; cv.height = outH;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, outW, outH);
      ctx.imageSmoothingQuality = 'high';   // 縮圖品質，讓浮水印文字保持清晰
      ctx.drawImage(img, 0, 0, iw, ih, dx, dy, drawW, drawH);

      currentDataUrl = cv.toDataURL('image/jpeg', JPEG_Q);
      $('previewImg').src = currentDataUrl;
      $('preview').style.display = 'block';
      updateStepper();

      // 白邊方向與厚度（僅供顯示，讓現場確認畫面完整）
      const padSide = (dy > dx) ? '上下' : (dx > 0 ? '左右' : '無');
      const padPx   = Math.max(dx, dy);
      console.log('[compress] 原圖 ' + iw + 'x' + ih +
        ' → 畫布 ' + outW + 'x' + outH + '（圖 ' + drawW + 'x' + drawH +
        '，白邊 ' + padSide + ' ' + padPx + 'px），約 ' +
        Math.round(currentDataUrl.length * 3 / 4 / 1024) + ' KB');

      // ★自我驗證：確認輸出比例吻合容器，且原圖完整無裁切★
      const outRatio = outW / outH;
      const diff = Math.abs(outRatio - BOX_RATIO);
      const info = $('cropInfo');
      if (diff < 0.01) {
        info.className = 'chip cropinfo';
        info.textContent = '✓ 原圖完整保留，浮水印未裁切　' + outW + '×' + outH +
          '　白邊 ' + (padSide === '無' ? '無' : padSide + ' ' + padPx + 'px');
      } else {
        info.className = 'chip cropinfo bad';
        info.textContent = '⚠ 比例不符 ' + outRatio.toFixed(3) +
          '（應為 ' + BOX_RATIO.toFixed(3) + '）→ 版本未更新，請重新部署';
      }
    } catch (err) {
      console.error('[compress] 處理失敗：', err);
      toast('照片處理失敗：' + err.message, 'err');
    } finally {
      if (done) done();  // 釋放 objectURL
    }
  };

  img.onerror = () => {
    console.error('[compress] 照片解碼失敗（格式不支援或檔案損毀）');
    toast('照片無法讀取，可能是格式不支援（如 HEIC），請改用 JPEG 或重拍', 'err');
    if (done) done();
  };

  img.src = src;
}

/* ============================================================
 * 上傳
 * ① res 結構防呆（後端若回傳非預期格式不會讓前端炸掉）
 * ② withFailureHandler 記錄實際錯誤內容（舊版只顯示「連線失敗」，
 *    看不出是逾時、權限還是後端 throw，之後查 log 就有依據）
 * ③ ym 依拍攝日優先（見 nowYm / ymFromYmd 說明）
 * ============================================================ */
$('upBtn').onclick = () => {
  if (!currentDataUrl) return;
  $('upBtn').disabled = true;
  $('upBtn').textContent = '上傳中…';

  const payload = {
    room: $('room').value,
    equip: $('equip').value,
    item: $('item').value,
    // ★v6 A 方案★ Drive 資料夾年月：有拍攝日用拍攝日，否則用上傳當天
    ym: currentShotYmd ? ymFromYmd(currentShotYmd) : nowYm(),
    shotYmd: currentShotYmd || '',   // 後端據此決定施工/完工日期與月份分頁
    dataUrl: currentDataUrl
  };
  console.log('[upload] 開始上傳：' + payload.room + ' / ' + payload.equip + ' / ' + payload.item + ' / ' + payload.ym);

  const resetBtn = () => {
    $('upBtn').disabled = false;
    $('upBtn').textContent = '上傳並歸檔';
  };

  google.script.run
    .withSuccessHandler(res => {
      resetBtn();
      if (res && res.ok) {
        uploadedCount++;
        console.log('[upload] 成功：' + res.name + '（第 ' + uploadedCount + ' 張）');
        toast('已歸檔：' + res.name + ' | ' + (res.where || ''), 'ok');
        $('preview').style.display = 'none';
        $('shotInfo').style.display = 'none';
        currentDataUrl = null;
        currentShotYmd = null;
        $('camInput').value = '';
        $('galInput').value = '';
        $('count').textContent = '本次已上傳 ' + uploadedCount + ' 張';
        $('count').classList.add('show');
        updateStepper();
      } else {
        const msg = (res && res.error) ? res.error : '後端回傳格式異常';
        console.error('[upload] 後端回報失敗：', res);
        toast('上傳失敗：' + msg, 'err');
      }
    })
    .withFailureHandler(err => {
      resetBtn();
      console.error('[upload] 連線/執行失敗：', err);
      toast('連線失敗：' + (err && err.message ? err.message : '請重試'), 'err');
    })
    .uploadPhoto(payload);
};

/* ============================================================
 * Toast 提示
 * 修正舊版 bug：連續彈兩次 toast 時，第一次的 setTimeout 到點會把
 * 「第二則還在顯示的訊息」提前關掉。改為記住計時器並先清除。
 * ============================================================ */
let toastTimer = null;
function toast(msg, type) {
  const t = $('toast');
  if (toastTimer) clearTimeout(toastTimer);
  t.textContent = msg;
  t.className = 'show ' + (type || '');
  toastTimer = setTimeout(() => {
    t.className = t.className.replace('show', '').trim();
    toastTimer = null;
  }, 8000);
}
</script>
